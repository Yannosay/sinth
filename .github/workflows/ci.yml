name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: node scripts/test.js
      - name: Smoke test the CLI
        shell: bash
        run: |
          node bin/sinth.js create smoke --template starter --yes
          node bin/sinth.js check --root smoke
          node bin/sinth.js build --root smoke
          test -f smoke/dist/index.html

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - working-directory: vscode-sinth
        run: npm ci
      - working-directory: vscode-sinth
        run: xvfb-run -a npm test
      - working-directory: vscode-sinth
        run: npx vsce package --no-dependencies
